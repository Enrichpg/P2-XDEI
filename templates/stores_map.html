{% extends "base.html" %}
{% block title %}{{ _('Stores Map') }} – FIWARE Smart Store{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="fa-solid fa-map-location-dot"></i> {{ _('Stores Map') }}</h1>
</div>

<div id="map"></div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var map = L.map('map').setView([52.52, 13.40], 12);

        var lightTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        });

        var darkTiles = L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
            attribution: '© CARTO'
        });

        if (document.body.classList.contains('dark-mode')) {
            darkTiles.addTo(map);
        } else {
            lightTiles.addTo(map);
        }

        document.addEventListener('themeChanged', function () {
            if (document.body.classList.contains('dark-mode')) {
                map.removeLayer(lightTiles);
                darkTiles.addTo(map);
            } else {
                map.removeLayer(darkTiles);
                lightTiles.addTo(map);
            }
        });

        var storesData = [
            {% for s in stores %}
            {% set loc = s.location %}
            {% if loc is mapping and loc.value is defined and loc.value.coordinates is defined %}
                {% set slng = loc.value.coordinates[0] | float %}
                {% set slat = loc.value.coordinates[1] | float %}
            {% elif loc is string and ',' in loc %}
                {% set parts = loc.replace('[','').replace(']','').split(',') %}
                {% set slat = parts[0] | trim | float %}
                {% set slng = parts[1] | trim | float %}
            {% elif loc is string and ' ' in loc %}
                {% set parts = loc.split(' ') %}
                {% set slat = parts[0] | trim | float %}
                {% set slng = parts[1] | trim | float %}
            {% else %}
                {% set slat, slng = 52.52, 13.40 %}
            {% endif %}
            
            {% set sname = s.name.value if s.name is mapping else s.name %}
            {% set simg = s.image.value if s.image is mapping else (s.image or '') %}
            {% set scc = s.countryCode.value if s.countryCode is mapping else (s.countryCode or '') %}
            {% set sdesc = s.description.value if s.description is mapping else (s.description or '') %}
            {% set addr = s.address %}
            {% set addrval = addr.value if addr is mapping else { } %}
            {% set street = addrval.streetAddress if addrval is mapping else '' %}
            {
                id: "{{ s.id }}",
                lat: {{ slat }},
                lng: {{ slng }},
                name: "{{ sname|e }}",
                image: "{{ simg|e }}",
                countryCode: "{{ scc|lower }}",
                description: "{{ (sdesc[:80] + '…') if sdesc|length > 80 else sdesc|e }}",
                street: "{{ street|e }}",
                url: "{{ url_for('store_detail', id=s.id) }}"
            } {% if not loop.last %},{% endif %}
            {% endfor %}
        ];

    var customIcon = L.divIcon({
        className: '',
        html: '<div style="background:linear-gradient(135deg,#667eea,#764ba2);width:32px;height:32px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-size:14px">🏪</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -20]
    });

    storesData.forEach(function (s) {
        var marker = L.marker([s.lat, s.lng], { icon: customIcon }).addTo(map);

        var popupHtml = `
            <div class="store-map-card">
                ${s.image ? `<img src="${s.image}" alt="${s.name}" onerror="this.onerror=null; this.src='/static/img/placeholder.png';">` : ''}
                <strong>${s.name}</strong>
                ${s.countryCode ? `<img src="https://flagcdn.com/16x12/${s.countryCode}.png" style="vertical-align:middle;"> <span style="font-size:0.8rem;text-transform:uppercase;">${s.countryCode}</span>` : ''}
                ${s.street ? `<small><i class="fas fa-map-marker-alt"></i> ${s.street}</small>` : ''}
                ${s.description ? `<small>${s.description}</small>` : ''}
                <a href="${s.url}" class="view-more">{{ _("View details") }} <i class="fas fa-arrow-right"></i></a>
            </div>
        `;

        marker.bindPopup(popupHtml, { maxWidth: 220 });
        marker.on('mouseover', function () { this.openPopup(); });
        marker.on('click', function () { window.location.href = s.url; });
    });
});
</script>
{% endblock %}
